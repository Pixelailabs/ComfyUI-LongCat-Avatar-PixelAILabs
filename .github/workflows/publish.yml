name: Publish to Comfy Registry

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - "pyproject.toml"

permissions:
  contents: read

jobs:
  publish-node:
    name: Publish Custom Node to Registry
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'rookiestar28' }}
    permissions:
      contents: read
    steps:
      - name: Check out code
        # actions/checkout v7.0.0 (Node 24 runtime), pinned for supply-chain safety.
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Set up Python 3.10
        # actions/setup-python v6.3.0, pinned for supply-chain safety.
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.10"

      - name: Validate Comfy Registry metadata
        run: python scripts/validate_comfy_registry_metadata.py --require-finalized

      - name: Publish Custom Node
        # Pinned from Comfy-Org/publish-node-action main on 2026-06-09.
        uses: Comfy-Org/publish-node-action@d2366e7abb6ab16f3bb03e3520ae25c8cf749bc9
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
